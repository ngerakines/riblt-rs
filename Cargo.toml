[package]
name = "riblt"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Rateless Invertible Bloom Lookup Tables for set reconciliation"
repository = "https://github.com/ngerakines/riblt-rs"
keywords = ["set-reconciliation", "iblt", "bloom", "rateless", "sync"]
categories = ["data-structures", "algorithms"]

[features]
default = []
ecmh = ["dep:curve25519-dalek", "dep:sha2"]

[dependencies]
siphasher = "1"
curve25519-dalek = { version = "4", optional = true, features = ["digest"] }
sha2 = { version = "0.10", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
rand = "0.9"
siphasher = "1"

[[bin]]
name = "rateless-peer"
path = "src/bin/rateless_peer.rs"

[[bench]]
name = "reconciliation"
harness = false
